name: CD

# Only run when CI has passed and a push lands on main.
# This is the delivery gate — every merge to main produces a tagged image.
on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build · Push Docker image
    runs-on: ubuntu-latest
    # Require CI to pass first.  In GitHub, enforce this by setting a branch
    # protection rule: "Require status checks → CI" on main.
    needs: []                          # explicit ordering done via branch protection

    permissions:
      contents: read
      packages: write                  # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry.
      # GITHUB_TOKEN is provided automatically — no secret setup needed.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build metadata: tags the image as both the short SHA and "latest".
      # Short SHA lets you roll back to any specific commit without losing "latest".
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      # BuildKit cache speeds up repeat builds by reusing unchanged layers.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha          # GitHub Actions cache
          cache-to: type=gha,mode=max